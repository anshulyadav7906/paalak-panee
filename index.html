<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paalak Paneer 🥬🧀</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Kalam:wght@400;700&display=swap');
:root{--green:#4f8c59;--deep:#294d32;--mint:#e7f5e8;--cream:#fffaf1;--pink:#ff8fac;--yellow:#ffe7a8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"DM Sans",system-ui,sans-serif;color:var(--deep);background:linear-gradient(135deg,#fffaf1 0%,#f2fff4 48%,#fff2f6 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);z-index:0;pointer-events:none}
body:before{width:340px;height:340px;background:#dff1df66;left:-120px;top:20%}
body:after{width:300px;height:300px;background:#ffdbe766;right:-100px;bottom:8%}
.float{position:fixed;z-index:1;pointer-events:none;user-select:none;opacity:.55;animation:float 6s ease-in-out infinite alternate}
.f1{left:4%;top:12%;font-size:42px}.f2{right:6%;top:13%;font-size:34px;animation-delay:1s}
.f3{left:8%;bottom:10%;font-size:38px;animation-delay:2s}.f4{right:9%;bottom:15%;font-size:40px;animation-delay:.5s}
.f5{left:46%;top:5%;font-size:25px;animation-delay:1.5s}.f6{right:22%;top:48%;font-size:27px;animation-delay:2.5s}
@keyframes float{to{transform:translateY(-18px) rotate(8deg)}}
.wrap{position:relative;z-index:2;width:min(820px,92vw);margin:auto;padding:28px 0 55px}
.brand{text-align:center}.logo{font-family:Kalam,cursive;font-weight:700;font-size:clamp(38px,8vw,64px);color:var(--green);letter-spacing:-1px;text-shadow:2px 3px 0 #dcefdc}
.logo .paneer{font-family:inherit;color:#d99b4a}.tag{font-size:14px;opacity:.65;margin-top:-4px}
.decor{margin:13px auto 16px;display:flex;justify-content:center;gap:10px;font-size:14px}
.progress{height:9px;width:min(540px,86%);margin:0 auto 18px;background:#e2eee2;border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#76b77e,#ff9ab5,#ffd66f);border-radius:99px;transition:width .45s ease}
.card{position:relative;background:#fffffff2;border:2px solid #ffffff;border-radius:32px;box-shadow:0 24px 70px #315f3918;padding:clamp(24px,6vw,52px);min-height:480px;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden}
.card:before{content:"";position:absolute;inset:10px;border:1px dashed #b8d8bc88;border-radius:25px;pointer-events:none}
.corner{position:absolute;opacity:.55;font-size:25px}.c1{left:20px;top:18px}.c2{right:20px;top:18px}.c3{left:22px;bottom:18px}.c4{right:22px;bottom:18px}
.content{position:relative;z-index:2;animation:enter .42s ease}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#76a27b;margin-bottom:10px}
.illustration{font-size:62px;line-height:1;margin-bottom:18px;filter:drop-shadow(0 8px 8px #3b6f3b18)}
h1{font-size:clamp(24px,5vw,37px);line-height:1.28;margin:0 auto 28px;max-width:680px;letter-spacing:-.5px}
.buttons{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;min-height:54px}
.btn{border:0;border-radius:17px;padding:14px 27px;font:800 16px "DM Sans";cursor:pointer;box-shadow:0 8px 18px #3b6c4320;transition:transform .18s,box-shadow .18s;background:#edf5ed;color:var(--deep);position:relative}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 22px #3b6c4330}.yes{background:linear-gradient(135deg,#73b47b,#4e945b);color:white}.no{background:#ffe8ef;color:#9a5168}
.dodge{position:fixed;z-index:50;transition:left .12s ease,top .12s ease,transform .12s ease}
.hint{font-size:12px;opacity:.5;margin-top:20px}
.poemwrap{max-height:340px;overflow:auto;text-align:left;background:linear-gradient(145deg,#fffdf7,#f7fbf4);border:1px solid #eadfca;border-radius:22px;padding:22px clamp(17px,5vw,35px);box-shadow:inset 0 0 25px #dfd2b72b;margin-bottom:22px}
.poemtitle{text-align:center;font-family:Kalam,cursive;font-size:25px;color:#62896a;margin-bottom:13px}
.poem{font-family:Georgia,"Noto Serif Devanagari",serif;font-size:clamp(16px,3.5vw,20px);line-height:1.78;color:#3d493f}
.feedback{font-size:22px;margin:0 0 19px;font-weight:800}
.finalbig{font-family:Kalam,cursive;font-size:clamp(34px,7vw,55px);color:var(--green);margin-bottom:8px}
.paybtn{background:linear-gradient(135deg,#315e3b,#4e8c58);color:#fff;padding:16px 28px}
.shake{animation:shake .5s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.burst{font-size:38px;margin-bottom:10px}
@media(max-width:560px){.wrap{padding-top:22px}.card{min-height:520px;padding:27px 19px}.btn{width:min(270px,90%)}.buttons{flex-direction:column;align-items:center}.poemwrap{max-height:310px}.float{opacity:.28}}

.notes{margin-top:28px;padding:22px;border-radius:24px;background:linear-gradient(145deg,#fff8fb,#f5fff5);border:1px solid #eadfeb;text-align:left}
.notes h2{margin:0 0 6px;text-align:center;font-family:Kalam,cursive;font-size:30px;color:#4f8c59}
.notes p{text-align:center;margin:0 0 15px;font-size:13px;opacity:.65}
.notes textarea{display:block;width:100%;min-height:125px;resize:vertical;border:2px solid #e5eee5;border-radius:17px;padding:15px;font:600 15px "DM Sans";color:#294d32;background:#fff;outline:none}
.notes textarea:focus{border-color:#8fc497;box-shadow:0 0 0 4px #8fc49722}
.note-send{display:block;margin:13px auto 0;border:0;border-radius:15px;padding:13px 25px;background:linear-gradient(135deg,#73b47b,#4e945b);color:#fff;font:800 15px "DM Sans";cursor:pointer;box-shadow:0 8px 18px #3b6c4320}
.note-status{text-align:center;font-size:13px;margin-top:11px;min-height:20px}

.sent-congrats{border:0;background:transparent;padding:4px 8px;color:#4e945b;font:800 14px "DM Sans";cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sent-congrats:hover{transform:scale(1.02)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.sound-toggle{position:fixed;right:16px;bottom:16px;z-index:1000;border:1px solid #ffffff;background:#ffffffdd;backdrop-filter:blur(8px);border-radius:999px;padding:9px 13px;color:#416a48;font:800 13px "DM Sans";box-shadow:0 8px 22px #315f3920;cursor:pointer}

.music-toggle{position:fixed;right:16px;bottom:62px;z-index:1001;border:1px solid #ffffff;background:#ffffffdd;backdrop-filter:blur(8px);border-radius:999px;padding:9px 13px;color:#416a48;font:800 13px "DM Sans";box-shadow:0 8px 22px #315f3920;cursor:pointer}
</style></head>
<body><audio id="bgMusic" preload="auto" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<button class="music-toggle" id="musicToggle" onclick="toggleMusic()">🎵 Music On</button><button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊 Sound On</button>
<div class="float f1">🌿</div><div class="float f2">💚</div><div class="float f3">🥬</div><div class="float f4">💕</div><div class="float f5">✨</div><div class="float f6">🧀</div>
<main class="wrap">
  <header class="brand">
    <div class="logo">🥬 Paalak <span class="paneer">Paneer</span> 🧀</div>
    <div class="tag">A very serious questionnaire for Palak. 😌</div>
    <div class="decor">🌿　💚　🧀　💚　🌿</div>
  </header>
  <div class="progress"><span id="bar"></span></div>
  <section class="card" id="card"></section>
</main>
<script>


let musicOn=true, musicStarted=false;
function startMusic(){
  const m=document.getElementById("bgMusic");
  if(!m || !musicOn || musicStarted) return;

  m.volume=0.16;
  const p=m.play();
  if(p && typeof p.then==="function"){
    p.then(()=>{
      musicStarted=true;
      document.getElementById("musicToggle").textContent="🎵 Music On";
    }).catch(err=>{
      musicStarted=false;
      console.log("Background music could not start:",err);
    });
  }else{
    musicStarted=true;
  }
}
function toggleMusic(){
  const m=document.getElementById("bgMusic");
  musicOn=!musicOn;
  document.getElementById("musicToggle").textContent=musicOn?"🎵 Music On":"🔇 Music Off";
  if(musicOn){startMusic();}
  else m.pause();
}

let soundOn=true, audioCtx=null;
function ensureAudio(){
  if(!soundOn) return null;
  try{
    if(!audioCtx){
      const AudioCtor=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtor) return null;
      audioCtx=new AudioCtor();
    }
    if(audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }catch(e){
    return null;
  }
}
function tone(freq,duration=.09,type="sine",gain=.045,delay=0){
  const ctx=ensureAudio(); if(!ctx) return;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+delay);
  g.gain.setValueAtTime(.0001,ctx.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(gain,ctx.currentTime+delay+.012);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+duration);
  o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+duration+.02);
}
function sfxClick(){tone(520,.055,"sine",.035);tone(720,.07,"sine",.025,.035)}
function sfxWhoosh(){tone(180,.10,"sawtooth",.018);tone(95,.16,"sine",.014,.045)}
function sfxCheat(){tone(260,.07,"triangle",.025);tone(520,.08,"triangle",.022,.055);tone(850,.06,"triangle",.018,.11)}
function sfxError(){tone(180,.09,"square",.018);tone(125,.12,"square",.015,.10)}
function sfxSend(){tone(440,.07,"sine",.03);tone(660,.08,"sine",.025,.07);tone(880,.13,"sine",.02,.15)}
function sfxSparkle(){tone(880,.08,"sine",.022);tone(1175,.10,"sine",.018,.08);tone(1568,.16,"sine",.015,.18)}
function sfxTaDa(){tone(523,.10,"triangle",.03);tone(659,.10,"triangle",.03,.09);tone(784,.14,"triangle",.03,.18);tone(1047,.22,"triangle",.035,.30)}
function sfxCash(){tone(740,.08,"square",.018);tone(370,.12,"square",.014,.09);tone(185,.16,"square",.012,.20)}
function toggleSound(){
 soundOn=!soundOn;
 document.getElementById("soundToggle").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";
 if(soundOn) sfxClick();
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".btn,.note-send");
  if(b && !b.id) sfxClick();
},{passive:true});

const poem=`तेरे जाने की आहट तो सुनाई देती है,
मगर तेरा ख़ामोश हो जाना उम्र भर सुनाई देता है।

तू अपने हिस्से का सफ़र पूरा करके लौट जाती है,
मैं तेरे छोड़े हुए रास्तों पर उम्र भर चलता रहता हूँ।

तू मेरे पास थी भी या नहीं,
ये बात अब मायने रखती भी नहीं।

तू जो छोड़ गई है मुझमें,
वो किसी और में मिलती भी नहीं।

तू किसी रेल सी गुज़रती है,
मैं किसी पुल सा थरथराता हूँ।`;

const qs=[
["🔐💌","Kya tum mere saath apna koi aisa secret share karogi jo tumne kisi ko nahi bataya? 👀","YES 👀","NO 😌"],
["📖🎁","Kya aap apni padhi hui favourite book mujhe gift karogi? 📖🎁","YES 🥹","NO 😭"],
["🤪🌸","Tumhe nahi lagta ki tum ek pagal ladki ho? 😂","YES 😂","NO 🙂"],
["✍️🌿","Aapko nahi lagta ki aap ek pagal si Poet ho jo waqai… bakwaas poems likhti ho? 😭","YES 😭","NO 😤"]
];
let screen=0, dodgeBtn=null, dodgeTimer=null;
const card=document.getElementById("card"),bar=document.getElementById("bar");

function progress(n){bar.style.width=(n/6*100)+"%"}
function frame(inner){
 card.innerHTML=`<div class="corner c1">🌿</div><div class="corner c2">💚</div><div class="corner c3">🥬</div><div class="corner c4">✨</div><div class="content">${inner}</div>`;
}
function render(){
 if(dodgeTimer)clearInterval(dodgeTimer);dodgeBtn=null;
 progress(Math.min(screen,6));
 if(screen<4){
  const q=qs[screen];
  frame(`<div class="step">Question ${screen+1} of 6</div><div class="illustration">${q[0]}</div><h1>${q[1]}</h1><div class="buttons"><button class="btn yes" onclick="next()"> ${q[2]} </button><button class="btn no" id="dodge">${q[3]}</button></div><div class="hint">Choose wisely. 😌</div>`);
  activateDodge(document.getElementById("dodge"));
 }else if(screen===4){
  frame(`<div class="step">Question 5 of 6</div><div class="illustration">📜✨</div><h1 style="margin-bottom:12px">Okay… ab meri poem padho 👀</h1><div class="hint" style="margin:0 0 17px">Aur honestly batao… kaisi lagi? ❤️</div><div class="poemwrap"><div class="poemtitle">My Poem ❤️</div><div class="poem">${poem.replace(/\n/g,"<br>")}</div></div><div class="feedback">Meri poem kaisi lagi? ❤️</div><div class="buttons"><button class="btn yes" onclick="poemNext()">Bahut hi achhi 🥹❤️</button><button class="btn no" id="cheat">Ye toh cheating hai 😭😂</button></div>`);
  activateDodge(document.getElementById("cheat"));
 }else if(screen===5){
  frame(`<div class="step">Okay… 👀</div><div class="illustration">😭😂💚</div><div class="finalbig">Arre pagal 😂</div><div class="buttons" style="margin-top:25px"><button class="btn yes" onclick="screen=6;render()">NEXT 😌</button></div>`);
 }else{
  frame(`<div class="step">FINAL QUESTION 🚨</div><div class="illustration">💸🔓</div><h1>Ab next question unlock karne ke liye aapko <b>₹5,000</b> pay karne honge 😌</h1><div class="buttons"><button class="btn paybtn" onclick="finish()">🔓 Unlock Next Question — ₹5,000</button></div><div class="hint">Payment gateway is definitely very real. Trust me. 😌</div>`);
 }
}
function next(){
  // Never wait for audio before changing the question.
  sfxClick();
  screen++;
  render();
  if(!musicStarted && musicOn) startMusic();
}
function poemNext(){
  sfxSparkle();
  screen=5;
  render();
  if(!musicStarted && musicOn) startMusic();
}
function moveAway(btn, clientX, clientY){
  if(btn.id==="cheat") sfxCheat(); else sfxWhoosh();

  const pad=16, topPad=78;
  const w=btn.offsetWidth, h=btn.offsetHeight;
  const maxX=Math.max(pad,window.innerWidth-w-pad);
  const maxY=Math.max(topPad,window.innerHeight-h-pad);

  const r=btn.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=cx-clientX, dy=cy-clientY;
  const len=Math.hypot(dx,dy)||1;
  dx/=len; dy/=len;

  // Move in the direction opposite the cursor/touch, rather than randomly.
  const distance=220;
  let targetCx=cx+dx*distance;
  let targetCy=cy+dy*distance;
  targetCx=Math.min(Math.max(targetCx,w/2+pad),window.innerWidth-w/2-pad);
  targetCy=Math.min(Math.max(targetCy,h/2+topPad),window.innerHeight-h/2-pad);

  btn.classList.add("dodge");
  btn.style.left=(targetCx-w/2)+"px";
  btn.style.top=(targetCy-h/2)+"px";
  btn.style.transform=`rotate(${(Math.random()*8-4).toFixed(1)}deg)`;
}
function activateDodge(btn){
  dodgeBtn=btn;

  // The button moves ONLY when the user actually tries to press it.
  // No random timer and no mouse-proximity trigger.
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    e.stopPropagation();
    moveAway(btn,e.clientX,e.clientY);
  });

  btn.addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();
  });
}
function finish(){
 sfxCash();
 screen=7;
 progress(6);
 frame(`<div class="burst">😭😂🥬</div><div class="finalbig">Arre itna serious mat lo 😂</div><h1 style="font-size:25px">₹5,000 nahi dene hain yaar.</h1><p style="font-size:21px;line-height:1.5"><b>Lekin favourite book gift kar sakti ho 👀📖❤️</b></p><div style="font-size:35px">🥬 💚 🧀 💕 ✨</div><div class="notes"><h2>💌 Paalak ke Notes</h2><p>Ab itna sab hone ke baad kuch kehna hai? 👀</p><textarea id="note" placeholder="Yahan jo mann kare likho..."></textarea><button class="note-send" onclick="sendNote()">💚 Send to him</button><div class="note-status" id="noteStatus"></div></div>`);
 card.classList.add("shake");setTimeout(()=>card.classList.remove("shake"),600);
}


function showCongrats(){
 sfxTaDa();
 const overlay=document.createElement("div");
 overlay.style.cssText="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(39,25,45,.55);backdrop-filter:blur(5px)";
 overlay.innerHTML=`<div style="width:min(430px,100%);background:#fff;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.22);animation:pop .25s ease">
   <div style="font-size:45px">🎉💌🥬</div>
   <h2 style="margin:12px 0 8px;font-family:Kalam,cursive;font-size:34px;color:#4f8c59">Congratulations! 😭😂</h2>
   <p style="font-size:18px;line-height:1.55;margin:0;color:#333"><b>Congratulations! 🎉<br>Apka message pahunch gaya hai. 💚</b></p>
   <p style="font-size:15px;line-height:1.5;margin:12px 0 0;color:#666">Jao ab apna kaam karo 😌<br>Ab idhar hi baithi rahogi kya? 😂</p>
   <div style="font-size:28px;margin-top:16px">🌿🧀❤️✨</div>
 </div>`;
 document.body.appendChild(overlay);
}
async function sendNote(){
 const note=document.getElementById("note"), status=document.getElementById("noteStatus");
 const text=note.value.trim();
 if(!text){sfxError();status.textContent="Pehle kuch likho na 😭❤️";return}

 sfxSend(); status.textContent="Sending… 💌";
 const scriptUrl="https://script.google.com/macros/s/AKfycbwhyfHzAlTwawXDnyk8uyC8hOfLO9EZiIlwbRbTntBQGttVUOsr1T8Azh1FWXMS6x8WLQ/exec";

 try{
   const body=new URLSearchParams({note:text});
   await fetch(scriptUrl,{
     method:"POST",
     mode:"no-cors",
     headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
     body:body.toString()
   });

   sfxTaDa(); status.innerHTML='<button class="sent-congrats" onclick="showCongrats()">💌 Aapka message pahunch chuka hai</button>';
   note.value="";
 }catch(e){
   status.textContent="Oops 😭 Send nahi hua. Ek baar phir try karo.";
 }
}
render();
</script>
</body>
</html>
